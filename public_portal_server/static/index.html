<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>Portal de licitación · Llangón Asesores</title>
  <link rel="icon" href="/static/logo-llangon.png">
  <link rel="stylesheet" href="/static/portal.css">
</head>
<body>
  <main id="access-screen" class="access-screen">
    <form id="access-form" class="access-card">
      <img src="/static/logo-llangon.png" width="360" height="150" alt="Llangón Asesores">
      <p class="eyebrow">Acceso personal</p>
      <h1>Consulta de licitación</h1>
      <p>Introduce la palabra clave que has recibido.</p>
      <label>Palabra clave<input id="access-code" autocomplete="one-time-code" autocapitalize="characters" required></label>
      <p id="access-error" class="access-error" role="alert" hidden></p>
      <button id="access-submit" type="submit">Acceder</button>
      <small>El acceso y las descargas quedarán registrados por motivos de trazabilidad.</small>
    </form>
  </main>
  <main id="portal" hidden></main>
  <script src="/static/portal.js"></script>
</body>
</html>
