[pytest]
testpaths =
    webapp/infonalia_webapp/tests
addopts =
    -p no:cacheprovider
    --basetemp=.pytest_tmp
norecursedirs =
    .git
    .venv
    venv
    env
    .mypy_cache
    .ruff_cache
    .pytest_cache
    .pytest_tmp
    .pytest_tmp*
    __pycache__
    node_modules
    dist
    build
    htmlcov
    coverage
    runtime
    runtime_*
    logs
    backups
    backup
    backup*
    BACKUP*
    tmp
    temp
    staging
    download_staging
    downloads
    Dropbox
    .local_backups
    .local_runtime
    _NO_SUBIR_GITHUB
